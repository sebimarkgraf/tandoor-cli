[package]
name = "tandoor-cli"
version = "0.1.0"
edition = "2024"
description = "A Rust SDK and command-line client for Tandoor Recipes"
license = "AGPL-3.0-only"

[lib]
name = "tandoor"
path = "src/lib.rs"

[[bin]]
name = "tandoor"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
wiremock = "0.6"
